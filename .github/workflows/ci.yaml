name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runtime }}${{ matrix.node && format(' {0}', matrix.node) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, node: 20 }
          - { runtime: node, node: 24 }
          - { runtime: bun, node: 24 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: npm ci
      - run: npm run build
      - name: Tests on Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Tests on Bun
        if: matrix.runtime == 'bun'
        run: npm run test:bun

  coverage:
    name: Coverage gate and Codecov upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The coverage minimums were set with Bun 1.3.1's line counting. Bun 1.4.5
      # also counts unreachable guards (switch defaults, load-time table checks),
      # which lowers 6502-toolkit from 98 % to 97.5 % with the same tests. The
      # gate keeps the counting its minimums were set with; tests run on 1.4.5.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: npm ci
      - run: npm run coverage
      - name: Upload 6502-toolkit coverage to Codecov
        # Pull requests from forks get no secrets; their coverage gate still runs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: 6502-toolkit/coverage/lcov.info
          flags: 6502-toolkit
          fail_ci_if_error: true
          disable_search: true
      - name: Upload sidwave coverage to Codecov
        # Pull requests from forks get no secrets; their coverage gate still runs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sidwave/coverage/lcov.info
          flags: sidwave
          fail_ci_if_error: true
          disable_search: true

  package:
    name: Pack and clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: npm ci
      - run: npm run build
      - name: Pack both packages, install them in an empty project, compile on Node and Bun
        run: npm run check:consumer
      - name: Type-check a consumer project that imports every exported subpath
        run: npm run check:types
      - name: The sidwave command resolves after npm ci and npm run build in a fresh checkout
        run: npx --no-install sidwave --help
