name: Release

# Runs only when a tag of the form 6502-toolkit@<version> or sidwave@<version> is pushed. It does not run on pushes
# to branches or on pull requests. The tag version must equal the version in the package's package.json.
on:
  push:
    tags:
      - "6502-toolkit@*"
      - "sidwave@*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Resolve the package from the tag
        id: tag
        run: |
          name="${GITHUB_REF_NAME%@*}"
          version="${GITHUB_REF_NAME#*@}"
          have="$(node -p "require('./${name}/package.json').version")"
          if [ "$version" != "$have" ]; then
            echo "Tag version $version does not match $name/package.json version $have" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:bun
      - run: npm run check:consumer
      - run: npm run check:types
      - name: Publish
        run: npm publish --workspace "${{ steps.tag.outputs.name }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
