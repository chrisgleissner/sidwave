flags:
  6502-toolkit:
    paths:
      - 6502-toolkit/src/
    carryforward: true
  sidwave:
    paths:
      - sidwave/src/
    carryforward: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "reach, diff, flags, files"

ignore:
  - "**/test/**"
  - "**/dist/**"
  - "scripts/**"
